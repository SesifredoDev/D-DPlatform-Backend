services:
  api-service:
    build: ./api-service
    env_file: .env.${NODE_ENV}
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3000/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    ports:
      - "5000:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:3004,http://127.0.0.1:3005}
    depends_on:
      - redis
    networks:
      - d-platform-network

  messaging-service:
    build: ./messaging-service
    env_file: .env.${NODE_ENV}
    init: true
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - redis
    networks:
      - d-platform-network

  map-service:
    build: ./map-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    networks:
      - d-platform-network

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
      - ./certs:/etc/livekit
    restart: always
    env_file: .env.${NODE_ENV}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "40000-42000:40000-42000/udp"
    networks:
      - d-platform-network


  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./${NGINX_CONF:-nginx.local.conf}:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - d-platform-network
    depends_on:
      api-service:
        condition: service_healthy
      messaging-service:
        condition: service_started
      map-service:
        condition: service_started
      livekit:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - d-platform-network



networks:
  d-platform-network:
    driver: bridge

volumes:
  mongo-data:
